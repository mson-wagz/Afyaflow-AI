
services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_USER: afyaflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
      POSTGRES_DB: afyaflow
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afyaflow -d afyaflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: afyaflow-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://afyaflow:${POSTGRES_PASSWORD}@postgres:5432/afyaflow
      PORT: "3000"
      HOST: 0.0.0.0
      APP_ORIGIN: http://localhost:5173
      DATABASE_SSL: "false"
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
