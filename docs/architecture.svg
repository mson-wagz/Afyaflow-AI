<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 770" width="1240" height="770" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>AfyaFlow AI architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .zone { fill: #f8fafc; stroke: #e2e8f0; }
      .zone-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; fill: #64748b; }
      .box { fill: #ffffff; stroke: #0f766e; stroke-width: 1.5; }
      .box-ext { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .name { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .sub { font-size: 11.5px; fill: #475569; }
      .edge { stroke: #0f766e; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
      .edge-ext { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow-muted); }
      .label { font-size: 11px; fill: #0f766e; paint-order: stroke; stroke: #f8fafc; stroke-width: 4px; }
      .label-ext { font-size: 11px; fill: #64748b; paint-order: stroke; stroke: #ffffff; stroke-width: 4px; }
    </style>
  </defs>

  <rect width="1240" height="770" fill="#ffffff"/>

  <text x="30" y="42" font-size="22" font-weight="700" fill="#0f172a">AfyaFlow AI architecture</text>
  <text x="30" y="64" class="sub">AWS deployment path. Local dev runs the same pieces as Vite :5173 → NestJS :3000 → PostgreSQL, with a polling worker instead of SQS.</text>

  <!-- Zones -->
  <rect class="zone" x="30" y="84" width="270" height="420" rx="12"/>
  <text class="zone-label" x="46" y="108">STAFF DEVICE</text>
  <rect class="zone" x="330" y="84" width="270" height="420" rx="12"/>
  <text class="zone-label" x="346" y="108">EDGE &amp; API</text>
  <rect class="zone" x="630" y="84" width="270" height="420" rx="12"/>
  <text class="zone-label" x="646" y="108">DATA &amp; QUEUE</text>
  <rect class="zone" x="930" y="84" width="280" height="420" rx="12"/>
  <text class="zone-label" x="946" y="108">AGENT &amp; TOOLS</text>
  <rect class="zone" x="30" y="534" width="1180" height="200" rx="12" fill="#ffffff"/>
  <text class="zone-label" x="650" y="566">EXTERNAL SERVICES</text>

  <!-- Staff device -->
  <rect class="box" x="50" y="130" width="230" height="64" rx="8"/>
  <text class="name" x="66" y="157">React + Vite PWA</text>
  <text class="sub" x="66" y="177">Registration · Triage · Queue · Routing</text>

  <rect class="box" x="50" y="300" width="230" height="64" rx="8"/>
  <text class="name" x="66" y="327">Speech worker</text>
  <text class="sub" x="66" y="347">Whisper tiny · transformers.js · on-device</text>

  <!-- Edge & API -->
  <rect class="box" x="350" y="130" width="230" height="64" rx="8"/>
  <text class="name" x="366" y="157">CloudFront</text>
  <text class="sub" x="366" y="177">S3 static site · /api same-origin</text>

  <rect class="box" x="350" y="300" width="230" height="64" rx="8"/>
  <text class="name" x="366" y="327">NestJS API</text>
  <text class="sub" x="366" y="347">Lambda (or EC2 Docker + Caddy)</text>

  <!-- Data & queue -->
  <rect class="box" x="650" y="130" width="230" height="64" rx="8"/>
  <text class="name" x="666" y="157">PostgreSQL (RDS)</text>
  <text class="sub" x="666" y="177">visits · observations · audit · outbox</text>

  <rect class="box" x="650" y="260" width="230" height="64" rx="8"/>
  <text class="name" x="666" y="287">Outbox dispatcher</text>
  <text class="sub" x="666" y="307">scheduled Lambda</text>

  <rect class="box" x="650" y="400" width="230" height="64" rx="8"/>
  <text class="name" x="666" y="427">SQS agent queue</text>
  <text class="sub" x="666" y="447">+ dead-letter queue</text>

  <!-- Agent & tools -->
  <rect class="box" x="950" y="130" width="230" height="64" rx="8"/>
  <text class="name" x="966" y="157">Custom MCP tools</text>
  <text class="sub" x="966" y="177">observations · scoring · save proposal</text>

  <rect class="box" x="950" y="260" width="230" height="64" rx="8"/>
  <text class="name" x="966" y="287">Agent worker</text>
  <text class="sub" x="966" y="307">LangGraph · Lambda</text>

  <rect class="box" x="950" y="400" width="230" height="64" rx="8"/>
  <text class="name" x="966" y="427">Filesystem MCP</text>
  <text class="sub" x="966" y="447">versioned protocol · read-only</text>

  <!-- External -->
  <rect class="box-ext" x="50" y="580" width="230" height="64" rx="8"/>
  <text class="name" x="66" y="607">Hugging Face CDN</text>
  <text class="sub" x="66" y="627">speech model weights</text>

  <rect class="box-ext" x="350" y="580" width="230" height="64" rx="8"/>
  <text class="name" x="366" y="607">AWS Secrets Manager</text>
  <text class="sub" x="366" y="627">database credentials</text>

  <rect class="box-ext" x="950" y="580" width="230" height="64" rx="8"/>
  <text class="name" x="966" y="607">Model provider</text>
  <text class="sub" x="966" y="627">Bedrock Nova Lite · OpenAI · Ollama</text>

  <text class="sub" x="650" y="600" font-weight="600" fill="#0f172a">Human in the loop</text>
  <text class="sub" x="650" y="620">The agent can only save pending proposals.</text>
  <text class="sub" x="650" y="638">Approvals, overrides and transfers are</text>
  <text class="sub" x="650" y="656">committed by clinicians through the API.</text>

  <!-- Edges -->
  <path class="edge" d="M280,162 H348"/>
  <text class="label" x="292" y="154">HTTPS</text>

  <path class="edge" d="M465,194 V298"/>
  <text class="label" x="473" y="250">/api</text>

  <path class="edge" d="M165,196 V298" marker-start="url(#arrow)"/>
  <text class="label" x="173" y="250">audio stays local</text>

  <path class="edge" d="M580,332 L648,170"/>
  <text class="label" x="586" y="272">SQL</text>

  <path class="edge" d="M765,194 V258"/>
  <text class="label" x="773" y="230">outbox</text>

  <path class="edge" d="M765,324 V398"/>
  <text class="label" x="773" y="365">send</text>

  <path class="edge" d="M880,432 L948,300"/>
  <text class="label" x="906" y="395">deliver</text>

  <path class="edge" d="M1065,258 V196"/>
  <text class="label" x="1073" y="230">MCP</text>

  <path class="edge" d="M950,162 H882"/>
  <text class="label" x="902" y="154">SQL</text>

  <path class="edge" d="M1065,324 V398"/>
  <text class="label" x="1073" y="365">MCP</text>

  <path class="edge" d="M1180,292 H1198 V612 H1182"/>
  <text class="label" x="1120" y="530" stroke="#ffffff">LLM calls</text>

  <!-- External edges -->
  <path class="edge-ext" d="M165,578 V366"/>
  <text class="label-ext" x="173" y="520">first-load download</text>

  <path class="edge-ext" d="M465,578 V366"/>
  <text class="label-ext" x="473" y="520">credentials</text>

  <!-- Legend -->
  <line x1="50" y1="702" x2="80" y2="702" stroke="#0f766e" stroke-width="1.5"/>
  <text class="sub" x="88" y="706">AfyaFlow-owned services</text>
  <line x1="250" y1="702" x2="280" y2="702" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text class="sub" x="288" y="706">third-party services</text>
</svg>
